<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsightOS · Wendy Briel 2.1</title>

  <style>
    :root {
      /* Light */
      --bg: #c7b7ee;
      --ink: #2a2a2a;
      --subtle: rgba(42,42,42,.65);

      --chatgpt: #3a3a3a;
      --gemini: #e6ef6a;
      --claude: #e3dbf6;
      --grok: #7a8640;
      --manus: #343434;
      --copilot: #f0f27a;
    }

    [data-theme="dark"] {
      /* Dark */
      --bg: #15151a;
      --ink: #eaeaea;
      --subtle: rgba(234,234,234,.65);

      --chatgpt: #2e2e2e;
      --gemini: #8f963a;
      --claude: #3b3750;
      --grok: #4f5932;
      --manus: #1f1f1f;
      --copilot: #8a8c3f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Inter, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .canvas {
      width: 100%;
      max-width: 1200px;
      padding: 48px 32px 64px;
      position: relative;
    }

    .meta {
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .7;
    }

    .toggle {
      position: absolute;
      top: 24px;
      right: 32px;
      font-size: 13px;
      cursor: pointer;
      opacity: .7;
      user-select: none;
    }

    .toggle:hover { opacity: 1; }

    .header {
      text-align: center;
      margin: 40px 0 56px;
    }

    .header h1 {
      font-size: 56px;
      font-weight: 300;
      letter-spacing: .02em;
      margin: 0;
    }

    .header p {
      margin-top: 12px;
      font-size: 14px;
      opacity: .75;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 18px;
    }

    .tile {
      height: 140px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      color: var(--ink);
      transition: opacity .15s ease;
    }

    .tile:hover { opacity: .92; }

    .icon {
      font-size: 28px;
      margin-bottom: 14px;
    }

    .label {
      font-size: 15px;
      letter-spacing: .02em;
    }

    .chatgpt { background: var(--chatgpt); color: #fff; }
    .gemini  { background: var(--gemini); }
    .claude  { background: var(--claude); }
    .grok    { background: var(--grok); color: #fff; }
    .manus   { background: var(--manus); color: #fff; }
    .copilot { background: var(--copilot); }

    @media (max-width: 900px) {
      .tiles { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 520px) {
      .tiles { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

<body data-theme="light">
  <main class="canvas">
    <div class="meta">2026 · Wendy Briel 2.1</div>
    <div class="toggle" onclick="toggleTheme()">Light / Dark</div>

    <section class="header">
      <h1>InsightOS</h1>
      <p>Multi-Model Intelligence Environment</p>
    </section>

    <section class="tiles">
      <a class="tile chatgpt" href="#" target="_blank">
        <div class="icon">◼︎</div>
        <div class="label">ChatGPT</div>
      </a>

      <a class="tile gemini" href="#" target="_blank">
        <div class="icon">✦</div>
        <div class="label">Gemini</div>
      </a>

      <a class="tile claude" href="#" target="_blank">
        <div class="icon">✶</div>
        <div class="label">Claude</div>
      </a>

      <a class="tile grok" href="#" target="_blank">
        <div class="icon">／</div>
        <div class="label">Grok</div>
      </a>

      <a class="tile manus" href="#" target="_blank">
        <div class="icon">⎔</div>
        <div class="label">Manus</div>
      </a>

      <a class="tile copilot" href="#" target="_blank">
        <div class="icon">⌛︎</div>
        <div class="label">Copilot</div>
      </a>
    </section>
  </main>

  <script>
    function toggleTheme() {
      const body = document.body;
      body.dataset.theme =
        body.dataset.theme === "light" ? "dark" : "light";
    }
  </script>
</body>
</html>
